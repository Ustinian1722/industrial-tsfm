project:
  name: industrial-tsfm-phase2-cmapss-fd001-adaptation
  version: "0.2"

dataset:
  name: cmapss
  subset: FD001
  raw_dir: data/raw
  include_settings: true
  include_sensors: true
  context_length: 16
  horizon: 8
  train_window_stride: 1
  evaluation_origins: last
  train_fraction: 0.80
  validation_fraction: 0.20
  entity_split_seed: 2026

preprocessing:
  scaler: standard
  epsilon: 1.0e-8

adaptation:
  support_seed: 2026
  strategy_selection:
    min_calibration_windows: 2
  # Every support window ends before the final held-out target horizon.
  support_window_stride: 32
  support_fractions: [0.0, 0.01, 0.05, 0.10, 0.25, 0.50, 1.0]
  residual_calibration:
    enabled: true
  patchtst:
    epochs: 3
    batch_size: 64
    learning_rate: 0.0001
    weight_decay: 0.0001

runtime:
  seeds: [42]
  device: auto
  output_dir: results
  torch_num_threads: 1

models:
  naive:
    enabled: true
  patchtst:
    enabled: true
    patch_len: 8
    stride: 4
    d_model: 64
    n_heads: 4
    e_layers: 2
    d_ff: 128
    dropout: 0.10
    batch_size: 128
    epochs: 10
    patience: 3
    learning_rate: 0.001
    weight_decay: 0.0001
  timesfm:
    enabled: true
    model_id: google/timesfm-2.5-200m-pytorch
    max_context: 1024
    per_core_batch_size: 32
    inference_batch_size: 256
    normalize_inputs: false
    force_flip_invariance: true
    infer_is_positive: false
  chronos:
    enabled: true
    model_id: amazon/chronos-t5-tiny
    num_samples: 20
    inference_batch_size: 16
    temperature: 1.0
    top_k: 50
    top_p: 1.0
  chronos2:
    enabled: true
    model_id: amazon/chronos-2
    max_context: 8192
    inference_batch_size: 64
    cross_learning: false
  moirai2:
    enabled: true
    model_id: Salesforce/moirai-2.0-R-small
    inference_batch_size: 16
    point_quantile: 0.5
