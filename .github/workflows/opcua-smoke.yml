name: OPC-UA Smoke

on:
  push:
    paths:
      - "src/industrial_tsfm/platform/opcua.py"
      - "src/industrial_tsfm/platform/opcua_runtime.py"
      - "src/industrial_tsfm/platform/opcua_registry.py"
      - "src/industrial_tsfm/platform/runtime.py"
      - "src/industrial_tsfm/platform/forecasting.py"
      - "src/industrial_tsfm/platform/forecasting_deployment.py"
      - "src/industrial_tsfm/platform/forecasting_registry.py"
      - "src/industrial_tsfm/platform/forecasting_service.py"
      - "src/industrial_tsfm/platform/forecasting_uq.py"
      - "src/industrial_tsfm/platform/diagnosis.py"
      - "src/industrial_tsfm/platform/diagnosis_deployment.py"
      - "src/industrial_tsfm/platform/diagnosis_registry.py"
      - "src/industrial_tsfm/platform/diagnosis_service.py"
      - "src/industrial_tsfm/platform/diagnosis_api.py"
      - "src/industrial_tsfm/platform/online_anomaly.py"
      - "src/industrial_tsfm/platform/__init__.py"
      - "scripts/run_opcua_smoke.py"
      - "tests/test_platform_opcua.py"
      - "tests/test_platform_forecasting.py"
      - "tests/test_platform_forecasting_deployment.py"
      - "tests/test_platform_forecasting_registry.py"
      - "tests/test_platform_forecasting_safety.py"
      - "tests/test_platform_forecasting_service.py"
      - "tests/test_platform_forecasting_uq.py"
      - "tests/test_platform_diagnosis.py"
      - "tests/test_platform_diagnosis_deployment.py"
      - "tests/test_platform_diagnosis_registry.py"
      - "tests/test_platform_diagnosis_safety.py"
      - "tests/test_platform_diagnosis_service.py"
      - "pyproject.toml"
      - ".github/workflows/opcua-smoke.yml"
  pull_request:
    paths:
      - "src/industrial_tsfm/platform/opcua.py"
      - "src/industrial_tsfm/platform/opcua_runtime.py"
      - "src/industrial_tsfm/platform/opcua_registry.py"
      - "src/industrial_tsfm/platform/runtime.py"
      - "src/industrial_tsfm/platform/forecasting.py"
      - "src/industrial_tsfm/platform/forecasting_deployment.py"
      - "src/industrial_tsfm/platform/forecasting_registry.py"
      - "src/industrial_tsfm/platform/forecasting_service.py"
      - "src/industrial_tsfm/platform/forecasting_uq.py"
      - "src/industrial_tsfm/platform/diagnosis.py"
      - "src/industrial_tsfm/platform/diagnosis_deployment.py"
      - "src/industrial_tsfm/platform/diagnosis_registry.py"
      - "src/industrial_tsfm/platform/diagnosis_service.py"
      - "src/industrial_tsfm/platform/diagnosis_api.py"
      - "src/industrial_tsfm/platform/online_anomaly.py"
      - "src/industrial_tsfm/platform/__init__.py"
      - "scripts/run_opcua_smoke.py"
      - "tests/test_platform_opcua.py"
      - "tests/test_platform_forecasting.py"
      - "tests/test_platform_forecasting_deployment.py"
      - "tests/test_platform_forecasting_registry.py"
      - "tests/test_platform_forecasting_safety.py"
      - "tests/test_platform_forecasting_service.py"
      - "tests/test_platform_forecasting_uq.py"
      - "tests/test_platform_diagnosis.py"
      - "tests/test_platform_diagnosis_deployment.py"
      - "tests/test_platform_diagnosis_registry.py"
      - "tests/test_platform_diagnosis_safety.py"
      - "tests/test_platform_diagnosis_service.py"
      - "pyproject.toml"
      - ".github/workflows/opcua-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  opcua-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install OPC-UA platform dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas PyYAML scikit-learn pytest "asyncua>=1.1,<2"
          python -m pip install -e . --no-deps
          python -c "import importlib.metadata as m; print('asyncua=' + m.version('asyncua'))"

      - name: Run OPC-UA, forecasting, and diagnosis boundary tests
        run: |
          python -m pytest -q \
            tests/test_platform_opcua.py \
            tests/test_platform_forecasting.py \
            tests/test_platform_forecasting_deployment.py \
            tests/test_platform_forecasting_registry.py \
            tests/test_platform_forecasting_safety.py \
            tests/test_platform_forecasting_service.py \
            tests/test_platform_forecasting_uq.py \
            tests/test_platform_diagnosis.py \
            tests/test_platform_diagnosis_deployment.py \
            tests/test_platform_diagnosis_registry.py \
            tests/test_platform_diagnosis_safety.py \
            tests/test_platform_diagnosis_service.py

      - name: Run real asyncua server/client smoke
        run: python scripts/run_opcua_smoke.py

      - name: Verify smoke artifacts
        run: |
          test -s results/opcua-smoke/browse.json
          test -s results/opcua-smoke/snapshot.json
          test -s results/opcua-smoke/disconnected_runtime.json
          test -s results/opcua-smoke/live_runtime.json
          test -s results/opcua-smoke/live_forecast.json
          test -s results/opcua-smoke/live_diagnosis.json
          grep -q '"good_count": 2' results/opcua-smoke/snapshot.json
          grep -q '"authentication": "anonymous"' results/opcua-smoke/snapshot.json
          grep -q '"status": "reconnecting"' results/opcua-smoke/disconnected_runtime.json
          grep -Eq '"disconnects": [1-9][0-9]*' results/opcua-smoke/live_runtime.json
          grep -Eq '"reconnects": [1-9][0-9]*' results/opcua-smoke/live_runtime.json
          grep -q '"state_transitions"' results/opcua-smoke/live_runtime.json
          grep -q '"data_gap_seconds"' results/opcua-smoke/live_runtime.json
          grep -q '"read_only": true' results/opcua-smoke/live_runtime.json
          grep -q '"writes_enabled": false' results/opcua-smoke/live_runtime.json
          grep -q '"status": "stopped"' results/opcua-smoke/live_runtime.json
          grep -q '"schema_version": "industrial_tsfm.live_forecasting.v1"' results/opcua-smoke/live_forecast.json
          grep -q '"source_kind": "live"' results/opcua-smoke/live_forecast.json
          grep -q '"online_training": false' results/opcua-smoke/live_forecast.json
          grep -q '"name": "persistence-ci"' results/opcua-smoke/live_forecast.json
          grep -q '"schema_version": "industrial_tsfm.live_diagnosis.v1"' results/opcua-smoke/live_diagnosis.json
          grep -q '"source_kind": "live"' results/opcua-smoke/live_diagnosis.json
          grep -q '"online_training": false' results/opcua-smoke/live_diagnosis.json
          grep -q '"threshold_updated_online": false' results/opcua-smoke/live_diagnosis.json
          grep -q '"control_actions_enabled": false' results/opcua-smoke/live_diagnosis.json
          grep -q '"claim_scope": "statistical_reconstruction_contribution_not_causal_root_cause"' results/opcua-smoke/live_diagnosis.json

      - name: Upload OPC-UA smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: industsfm-opcua-smoke
          path: results/opcua-smoke/
          if-no-files-found: error
          retention-days: 14
